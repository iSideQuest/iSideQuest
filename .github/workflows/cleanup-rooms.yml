# Deletes SideKick rooms idle 24h+ so data stays small and 4-digit codes get reused.
# Saved games live under savedGames/ (untouched); live rooms frozen with
# status 'saved' are also skipped, since players may still sit on the saved screen.
name: Cleanup stale SideKick rooms

on:
  schedule:
    - cron: '17 * * * *' # hourly
  workflow_dispatch: {} # manual "Run workflow" button for testing

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete rooms idle 24h or more
        env:
          DB_URL: https://sidekick-tracker-default-rtdb.firebaseio.com
          DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          cat > /tmp/cleanup.mjs <<'EOF'
          const DB_URL = process.env.DB_URL;
          const SECRET = process.env.DB_SECRET;
          if (!SECRET) {
            console.error('FIREBASE_DB_SECRET is not set. Add it under repo Settings > Secrets and variables > Actions.');
            process.exit(1);
          }
          const STALE_MS = 24 * 60 * 60 * 1000;
          const MAX_DELETE = 500; // safety cap per run
          const now = Date.now();

          async function api(path, method, extra) {
            const url = `${DB_URL}/${path}.json?auth=${SECRET}${extra || ''}`;
            const res = await fetch(url, { method: method || 'GET' });
            if (!res.ok) throw new Error(`${method || 'GET'} ${path} -> HTTP ${res.status}`);
            return res.json();
          }

          const index = (await api('rooms', 'GET', '&shallow=true')) || {};
          const codes = Object.keys(index);
          let deleted = 0, kept = 0, savedSkipped = 0;
          for (const code of codes) {
            if (deleted >= MAX_DELETE) { console.log('Hit per-run cap, stopping early.'); break; }
            const room = await api(`rooms/${encodeURIComponent(code)}`);
            if (!room || typeof room !== 'object') continue;
            if (room.status === 'saved') { savedSkipped++; continue; }
            const ts = room.lastActivity || room.createdAt || 0;
            if (now - ts > STALE_MS) {
              await api(`rooms/${encodeURIComponent(code)}`, 'DELETE');
              console.log(`deleted ${code} (idle ${Math.round((now - ts) / 3600000)}h)`);
              deleted++;
            } else {
              kept++;
            }
          }
          console.log(`done: rooms=${codes.length} deleted=${deleted} kept=${kept} savedSkipped=${savedSkipped}`);
          EOF
          node /tmp/cleanup.mjs
